<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sparkstr — Coming to iPhone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            color: #171717;

            background:
                radial-gradient(circle at 15% 15%, rgba(255, 180, 220, 0.35), transparent 32%),
                radial-gradient(circle at 85% 20%, rgba(170, 210, 255, 0.35), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(255, 220, 150, 0.25), transparent 35%),
                #fafafa;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        .content {
            width: 100%;
            max-width: 580px;
            text-align: center;
        }

        /* Logo */

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1.2px;

            margin-bottom: 65px;
        }

        .spark {
            font-size: 27px;

            background: linear-gradient(
                135deg,
                #ff4f9a,
                #8b5cf6,
                #3b82f6
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Main icon */

        .app-icon {
    width: 82px;
    height: 82px;

    margin: 0 auto 30px;

    border-radius: 24px;

    display: block;

    object-fit: cover;

    box-shadow:
        0 15px 35px rgba(139, 92, 246, 0.22);
}
        /* Heading */

        h1 {
            font-size: clamp(36px, 7vw, 54px);
            line-height: 1.04;
            letter-spacing: -2.5px;

            margin-bottom: 20px;
        }

        /* Description */

        .description {
            max-width: 480px;

            margin: 0 auto;

            color: #666;

            font-size: 17px;
            line-height: 1.6;
        }

        /* Social section */

        .social-text {
            margin-top: 38px;
            margin-bottom: 16px;

            color: #888;

            font-size: 14px;
            font-weight: 500;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;

            flex-wrap: wrap;
        }

        .social-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-width: 145px;

            padding: 13px 19px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                opacity 0.18s ease;
        }

        .social-button:hover {
            transform: translateY(-2px);
        }

        .social-button:active {
            transform: translateY(0);
        }

        /* Instagram */

        .instagram {
            color: white;

            background: linear-gradient(
                135deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );

            box-shadow:
                0 8px 20px rgba(253, 29, 29, 0.18);
        }

        .instagram:hover {
            box-shadow:
                0 12px 26px rgba(253, 29, 29, 0.25);
        }

        /* TikTok */

        .tiktok {
            color: white;
            background: #111;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.14);
        }

        .tiktok:hover {
            box-shadow:
                0 12px 26px rgba(0, 0, 0, 0.20);
        }

        /* Icons */

        .social-icon {
            width: 19px;
            height: 19px;

            flex-shrink: 0;
        }

        /* Footer */

        .footer {
            margin-top: 65px;

            color: #aaa;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 24px 18px;
            }

            .logo {
                margin-bottom: 52px;
                font-size: 25px;
            }

            .app-icon {
    width: 72px;
    height: 72px;

    border-radius: 21px;

    margin-bottom: 25px;
}

            h1 {
                letter-spacing: -1.8px;
            }

            .description {
                font-size: 16px;
            }

            .social-buttons {
                flex-direction: column;
                align-items: center;
            }

            .social-button {
                width: 100%;
                max-width: 280px;
            }

            .footer {
                margin-top: 50px;
            }
        }
    </style>
</head>

<body>

    <main class="content">

       


        <!-- App icon -->
        <!-- App icon -->
<img
    class="app-icon"
    src="Sparkstr.png"
    alt="Sparkstr app icon"
>


        <!-- Main message -->
        <h1>
            Sparkstr is coming to iPhone.
        </h1>

        <p class="description">
            The iOS version isn't available just yet,
            but we're working on it and it'll be coming soon.
        </p>


        <!-- Social links -->
        <p class="social-text">
            Follow us to stay in the loop
        </p>

        <div class="social-buttons">

            <!-- Instagram -->
            <a
                class="social-button instagram"
                href="https://www.instagram.com/spark_str/?hl=en"
                target="_blank"
                rel="noopener noreferrer"
            >

                <!-- Instagram SVG icon -->
                <svg
                    class="social-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1"
                        fill="currentColor"
                        stroke="none"
                    ></circle>
                </svg>

                Instagram

            </a>


            <!-- TikTok -->
            <a
                class="social-button tiktok"
                href="https://www.tiktok.com/@spark_str"
                target="_blank"
                rel="noopener noreferrer"
            >

                <!-- TikTok icon -->
                <svg
                    class="social-icon"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                >
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-3.77A4.8 4.8 0 0 1 15.7 2h-3.36v13.67a2.86 2.86 0 1 1-2-2.71V9.54a6.2 6.2 0 1 0 5.49 6.13V8.79a8.2 8.2 0 0 0 3.76.91V6.69z"/>
                </svg>

                TikTok

            </a>

        </div>


        <div class="footer">
            © 2026 Sparkstr
        </div>

    </main>

</body>
</html>
